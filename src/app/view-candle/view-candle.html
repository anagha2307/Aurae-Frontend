<app-header></app-header>
<div class="container-fluid max-w-7xl mx-auto my-5 p-5">
    <div class="md:grid md:grid-cols-2 gap-5">
        <!--Image grid with mutiple imgs-->
        <div class="grid gap-4">
            <div>
                <img class="h-auto w-full max-w-150 rounded-lg object-cover object-center md:h-[450px]"
                    src="https://www.kimirica.shop/cdn/shop/files/CandleWorks-Listing_Image-Template-July2025-37.jpg?v=1755064607&width=500"
                    alt="" />
            </div>
            <div class="grid grid-cols-5 gap-4">
                <div>
                    <img src="https://images.unsplash.com/photo-1499696010180-025ef6e1a8f9?ixlib=rb-4.0.3&amp;ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&amp;auto=format&amp;fit=crop&amp;w=1470&amp;q=80"
                        class="object-cover object-center h-20 max-w-full rounded-lg cursor-pointer"
                        alt="gallery-image" />
                </div>
                <div>
                    <img src="https://images.unsplash.com/photo-1432462770865-65b70566d673?ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&amp;ixlib=rb-1.2.1&amp;auto=format&amp;fit=crop&amp;w=1950&amp;q=80"
                        class="object-cover object-center h-20 max-w-full rounded-lg cursor-pointer"
                        alt="gallery-image" />
                </div>
                <div>
                    <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?ixlib=rb-4.0.3&amp;ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&amp;auto=format&amp;fit=crop&amp;w=2940&amp;q=80"
                        class="object-cover object-center h-20 max-w-full rounded-lg cursor-pointer"
                        alt="gallery-image" />
                </div>
                <div>
                    <img src="https://images.unsplash.com/photo-1518623489648-a173ef7824f3?ixlib=rb-4.0.3&amp;ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&amp;auto=format&amp;fit=crop&amp;w=2762&amp;q=80"
                        class="object-cover object-center h-20 max-w-full rounded-lg cursor-pointer"
                        alt="gallery-image" />
                </div>
                <div>
                    <img src="https://images.unsplash.com/photo-1682407186023-12c70a4a35e0?ixlib=rb-4.0.3&amp;ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&amp;auto=format&amp;fit=crop&amp;w=2832&amp;q=80"
                        class="object-cover object-center h-20 max-w-full rounded-lg cursor-pointer"
                        alt="gallery-image" />
                </div>
            </div>
        </div>
        <div class="p-6">
            <h5 class="font-normal">SAFFRON AND SANDALWOOD</h5>
            <h1 class="font-semibold text-red-950 text-4xl pt-3">The Vanilla Breeze Scented Candle</h1>
            <h6 class="mt-5">Feels like a warm hug at the end of a long day</h6>
            <div class="flex justify-between items-center mt-4">
                <h3 class="font-bold">₹ 449</h3>
                <span class="text-md"><i class="fa-solid fa-star"></i>4.2</span>
            </div>
            <span class="font-normal text-sm text-coral-300">(MRP Inclusive of all taxes)</span>
            <!--Cart btn and quantity-->
            <div class="md:flex md:items-center sm:justify-start justify-between gap-4 md:gap-10">
                <div class="row flex my-5 border border-red-950 p-1">
                    <button class="py-1 px-5 text-center text-xl hover:text-red-800" type="button">-</button>
                    <button class="py-1 px-5 text-center text-xl hover:text-red-800" type="button">1</button>
                    <button class="py-1 px-5 text-center text-xl hover:text-red-800" type="button">+</button>
                </div> 
                <a routerLink="/cart" class="w-full sm:mx-auto">
                    <button class="border border-red-950 bg-red-950 text-white py-3 lg:px-24 text-center text-xl 
                    shadow-sm hover:shadow-md hover:text-red-950 hover:bg-white" type="button">ADD TO CART</button>
                </a>
            </div>
            <!--features and description-->
            <!-- Accordion Item 1 -->
            <div class="border-b border-red-950">
                <button (click)="toggleAccordion(0)" class="w-full flex justify-between items-center py-5 text-red-950">
                    <h5 class="font-normal">DESCRIPTION</h5>
                    <span class="text-red-950 transition-transform duration-300"><i
                            class="fa-solid fa-angle-down"></i></span>
                </button>
                <div class="max-h-0 overflow-hidden transition-all duration-300 
                    ease-in-out">
                    <div class="pb-5 max-h-56 text-sm text-red-900">Material Tailwind allows you to quickly build modern,
                        responsive websites with a focus on design.</div>
                </div>
            </div>
            <!-- Accordion Item 2 -->
            <!-- Accordion Item 3 -->
        </div>
    </div>
</div>
<app-footer></app-footer>
